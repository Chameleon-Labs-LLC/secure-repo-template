# Dependabot: free, GitHub-side dependency and advisory monitoring.
# Guide: docs/security-setup.md, step 4.
#
# This file controls VERSION updates. Two other switches live in the repo's
# Settings -> Code security, and a config file cannot turn them on:
#   - Dependabot alerts            (reports vulnerable dependencies)
#   - Dependabot security updates  (opens PRs that fix them)
#
# Shape:
#   - Security updates are grouped into ONE PR per ecosystem, so a bad week
#     does not open fifteen PRs.
#   - Version updates run weekly, minor and patch only, grouped. Do majors by
#     hand, with the changelog read. The semver-major `ignore` below gates
#     VERSION updates only: SECURITY updates walk past it, so a security fix
#     that lives in a new major still arrives as a PR.
#   - "No PR" never means "no vulnerability". Transitive-only dependencies and
#     advisories with no fixed version show up only as alerts. Read the alerts.
#   - `cooldown` waits 7 days before proposing a new version, the same floor
#     as `min-release-age` in .npmrc. Security updates are not delayed by it.
#
# TO ADAPT: only the github-actions block is active, because this template has
# no package manifest yet. Uncomment the block for each ecosystem your project
# uses and set `directory` to where its manifest lives. Dependabot reports an
# error for an ecosystem whose manifest it cannot find.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "07:30"
      timezone: Etc/UTC
    open-pull-requests-limit: 1
    cooldown:
      default-days: 7
    groups:
      # No `applies-to: security-updates` group here: it could never fire,
      # because SHA-pinned actions get no Dependabot alerts.
      actions:
        applies-to: version-updates
        patterns: ["*"]
        update-types: ["minor", "patch"]
    # NO semver-major ignore here, unlike the other ecosystems, on purpose.
    # GitHub generates Dependabot alerts only for actions on semantic versions,
    # NOT for SHA pins, so no security update can ever fire for a pinned
    # action. The weekly VERSION update is the only automatic remediation, and
    # ignoring majors would remove it. Advisory DETECTION for actions comes
    # from the `github/actions` osv-scanner plugin in security.yml.

