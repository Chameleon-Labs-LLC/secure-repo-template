  # --- pip: uncomment when the repo has requirements.txt or pyproject.toml --
  # The version-update group deliberately has NO `update-types` filter.
  # Projects that declare loose floors (`httpx>=0.27`) get REQUIREMENT changes,
  # which carry no from->to pair and so match no `update-types` value: the
  # filter would silently drop every such update out of the group and open one
  # PR each.
